[package]
name = "my-launcher"
version = "0.2.0"
edition = "2021"
description = "Beautiful Minecraft Launcher written in Rust"
authors = ["ZeeinJordansky"]
license = "MIT"

[dependencies]
eframe = { version = "0.27", default-features = true, features = ["persistence"] }
egui = "0.27"
egui_extras = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
image = "0.24"
rfd = "0.14"
open = "5"
dirs = "5"
log = "0.4"
env_logger = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
sha1 = "0.10"
hex = "0.4"
zip = "0.6"
which = "6"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
