[package]
name = "my-launcher"
version = "0.1.0"
edition = "2021"
description = "Beautiful Minecraft Launcher written in Rust"
authors = ["ZeeinJordansky"]
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["persistence"] }
egui = "0.29"
egui_extras = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
image = "0.25"
rfd = "0.15"
open = "5"
dirs = "5"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
